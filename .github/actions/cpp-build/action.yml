name: C++ Build
description: Build and test a cpp-cmake-azure service through its pinned container toolchain

inputs:
  working_directory:
    description: Repository-relative CMake project root
    required: false
    default: .

outputs:
  build_result:
    description: Build result consumed by the image jobs
    value: ${{ steps.build.outputs.build_result }}

runs:
  using: composite
  steps:
    - name: Build and test
      id: build
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail
        .spi/ci/build.sh
        echo "build_result=success" >> "$GITHUB_OUTPUT"
