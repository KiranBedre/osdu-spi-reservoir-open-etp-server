version: 0.2

env:
  secrets-manager:
    DOCKER_USERNAME: /osdu/devops/docker_credentials:username
    DOCKER_PASSWORD: /osdu/devops/docker_credentials:password

phases:
  install:
    commands:
      # fix error noted here: https://github.com/yarnpkg/yarn/issues/7866
      - curl -sS https://dl.yarnpkg.com/debian/pubkey.gpg | apt-key add -
      - apt-get update -y -qq
      - export AWS_ACCOUNT_ID=`aws sts get-caller-identity | grep Account | cut -d':' -f 2 | cut -d'"' -f 2`
      # Install git secrets
      #TODO temporarily adding hotfix, due to https://github.com/awslabs/git-secrets/issues/220
      - export REPO_NAME=${PWD##*/}
      - apt-get --assume-yes install jq pipx
      - pipx ensurepath
      - pipx install poetry
      - export SAY_LOCATION=`ln -s "$(which echo)" say`
      - export PATH="$PATH:$SAY_LOCATION:$HOME/.local/bin"
      - poetry --version

      - git clone https://github.com/awslabs/git-secrets.git
      - cd git-secrets && make install && cd ..
      - git secrets --install && git secrets --register-aws
      - export VCPKG_DEFAULT_BINARY_CACHE="$PWD/.vcpkg_cache/"
      # - mkdir -p $VCPKG_DEFAULT_BINARY_CACHE
  pre_build:
    commands:
      - export BRANCH_NAME=`echo ${BRANCH_NAME} | awk '{gsub("refs/heads/","");gsub("\\.","-");gsub("[[:space:]]","-")}1' | sed 's/\//-/g' | awk '{print tolower($0)}'`

      - |
        aws s3 cp --quiet $VCPKG_CACHE_BUCKET/$REPO_NAME/$BRANCH_NAME/vcpkg_cache.zip . || \
        aws s3 cp --quiet $VCPKG_CACHE_BUCKET/$REPO_NAME/dev/vcpkg_cache.zip . || \
        aws s3 cp --quiet $VCPKG_CACHE_BUCKET/vcpkg_cache.zip .
      - unzip -q vcpkg_cache.zip
      - ls -la .vcpkg_cache


      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${ECR_REGISTRY}
      - echo "Logging into Docker Hub..."
      - docker login -u ${DOCKER_USERNAME} -p ${DOCKER_PASSWORD}
  build:
    commands:
      - export OUTPUT_DIR="dist"
      - mkdir $OUTPUT_DIR
      - echo "Building binaries for OpenETPServer"
      - echo "Give rights to posgres user to run init script:"
      - chmod o+rwx -R devops/scripts/init-db
      - echo "Running docker-compose build"
      - docker-compose build
      - docker image inspect -f '{{ range $k, $v := .Config.Labels -}} {{ $k }}={{ $v }}; {{ end -}}' open_etp_server_build

      # - echo "Looking for host path for bind mounts"
      # - export CONTAINER_ID=$(docker ps -q -f "label=com.gitlab.gitlab-runner.job.id=$CI_JOB_ID" -f "label=com.gitlab.gitlab-runner.type=build")
      # - export MOUNT_NAME=$(docker inspect $CONTAINER_ID -f "{{ range .Mounts }}{{ if eq .Destination \"/builds\" }}{{ .Source }}{{end}}{{end}}")
      - pwd
      - export SOURCE_HOST_DIR=$(pwd)
      - echo $SOURCE_HOST_DIR
      
      # --force recreate to ensure containers are new ones
      # --renew-anon-volumes to ensure no previous data is used
      # --exit-code-from to exit as soon as build is finished and use it exit code (failure reporting)
      - docker-compose up --force-recreate --renew-anon-volumes --exit-code-from open_etp_server_build

      - echo "Create a runtime image"
      - docker-compose build open_etp_server_runtime
      - docker image inspect -f '{{ range $k, $v := .Config.Labels -}} {{ $k }}={{ $v }}; {{ end -}}' open_etp_server_runtime
      - ls .vcpkg_cache
      - ls build

      - export ECR_TAG=`echo build.${BRANCH_NAME}.${CODEBUILD_BUILD_NUMBER}.${COMMIT_ID} | cut -c 1-120`
      - export ECR_IMAGE=${ECR_REGISTRY}:${ECR_TAG}
      - export ECR_IMAGE_BRANCH_LATEST=${ECR_REGISTRY}:${BRANCH_NAME}

      - echo "[INFO] Building server image"
      - docker build -t $ECR_IMAGE --file Dockerfile.aws --build-arg DIST=build/using_docker/dist.tgz .
      - docker tag  ${ECR_IMAGE} ${ECR_IMAGE_BRANCH_LATEST}
      - echo "Pushing docker image..."
      - docker push ${ECR_IMAGE}
      - docker push ${ECR_IMAGE_BRANCH_LATEST}

      - mkdir -p $OUTPUT_DIR/testing/integration/build-aws/data
      - ./tests/providers/aws/prepare-dist.sh

      - echo "Generate build-info.json"
      - |
        python providers/aws/build-aws/build-info.py \
        --branch ${BRANCH_NAME} \
        --commitId ${COMMIT_ID} \
        --commitMessage "\"${COMMIT_MESSAGE}\"" \
        --commitAuthor "\"${COMMIT_AUTHOR}\"" \
        --commitDate "\"${COMMIT_DATE}\"" \
        --buildid ${CODEBUILD_BUILD_ID} \
        --buildnumber ${CODEBUILD_BUILD_NUMBER} \
        --reponame ${REPO_NAME} \
        --outdir ${OUTPUT_DIR} \
        --artifact ${ECR_IMAGE}
  post_build:
    commands:
      - |
        if [ $CODEBUILD_BUILD_SUCCEEDING -eq 1 ] ; then \
            echo "Zipping and sending VCPKG cache to S3 bucket." ; \
            zip -qr new_vcpkg_cache.zip .vcpkg_cache ; \
            aws s3 cp --quiet new_vcpkg_cache.zip $VCPKG_CACHE_BUCKET/$REPO_NAME/$BRANCH_NAME/vcpkg_cache.zip ; \
        fi
artifacts:
  files:
    - "**/*"
  base-directory: "dist"
  name: ${BRANCH_NAME}/${PACKAGE_NAME}.zip
