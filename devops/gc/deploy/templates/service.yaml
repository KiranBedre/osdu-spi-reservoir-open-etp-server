apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.conf.appName | quote }}
  annotations:
    {{- if not .Values.global.onPremEnabled }}
    cloud.google.com/neg: '{"ingress": true}'
    {{- end }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ .Values.conf.appName | quote }}
spec:
  ports:
    - protocol: TCP
      port: 9002
      targetPort: 9002
      name: http
  selector:
    app: {{ .Values.conf.appName | quote }}
