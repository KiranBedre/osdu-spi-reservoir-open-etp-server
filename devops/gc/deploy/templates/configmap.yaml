apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: {{ .Values.conf.appName | quote }}
  name: {{ .Values.conf.configmap | quote }}
  namespace: {{ .Release.Namespace | quote }}
data:
  CLOUD_PROVIDER: {{ .Values.data.cloudProvider | quote }}
  DOMAIN_NAME: {{ .Values.data.groupId | quote }}
  ENTITLEMENTS_URL: {{ .Values.data.entitlementsUrl | quote }}
  OSDU_HOST: {{ printf "https://%s" .Values.global.domain | quote }}
  PARTITION_URL: {{ .Values.data.partitionUrl | quote }}
  RDMS_DATA_CONNECTIVITY_MODE: {{ .Values.data.rdmsDataConnectivityMode | quote }}
  RDMS_DATA_PARTITION_MODE: {{ .Values.data.rdmsDataPartitionMode | quote }}
  STORAGE_URL: {{ .Values.data.storageUrl | quote }}
  GOOGLE_LOG_LEVEL: {{ .Values.data.logLevel | default .Values.global.logLevel | quote }}
