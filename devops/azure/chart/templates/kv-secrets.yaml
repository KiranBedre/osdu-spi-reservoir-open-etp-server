{{- $namespace := .Release.Namespace }}
{{- $release := .Release.Name }}
{{- if .Values.postgres.kvSecretName }}
apiVersion: secrets-store.csi.x-k8s.io/v1alpha1
kind: SecretProviderClass
metadata:
  name: azure-keyvault-reservoir
  namespace: {{ $namespace }}
spec:
  provider: azure
  secretObjects:
  - secretName: {{ $release }}-postgres-connection
    type: Opaque
    data:
    - objectName: {{ .Values.postgres.kvSecretName }}
      key: postgres-conn
  parameters:
    usePodIdentity: "true"
    useVMManagedIdentity: "false"
    userAssignedIdentityID: ""
    resourceGroup: "{{ .Values.azure.resourcegroup }}"
    keyvaultName: "{{ .Values.azure.keyvault }}"
    subscriptionId: "{{ .Values.azure.subscription }}"
    tenantId: "{{ .Values.azure.tenant }}"
    objects: |
      array:
        - |
          objectName: {{ .Values.postgres.kvSecretName }}
          objectType: secret
{{- end }}
